name: Deploy Prototype

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p ~/public_html/prototype

            if [ ! -d ~/public_html/prototype/.git ]; then
              git clone https://github.com/newrsa/rsa-sign-up-sign-in-flow.git ~/public_html/prototype
            else
              cd ~/public_html/prototype
              git fetch origin
              git reset --hard origin/dev
            fi

            cd ~/public_html/prototype
            npm install --legacy-peer-deps
            npm run build

            cp -r dist/* ~/public_html/prototype/

            cat > ~/public_html/prototype/.htaccess << 'EOF'
            Options -MultiViews
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^ index.html [QSA,L]
            EOF

            echo "Deployment Completed"
