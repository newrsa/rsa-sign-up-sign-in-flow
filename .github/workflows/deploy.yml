name: Build and Debug React App

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build

      - name: Show Build Output
        run: |
          echo "========== CURRENT DIRECTORY =========="
          pwd

          echo "========== ROOT FILES =========="
          ls -la

          echo "========== ALL DIRECTORIES =========="
          find . -maxdepth 3 -type d

          echo "========== DIST =========="
          ls -la dist || true

          echo "========== .OUTPUT =========="
          ls -la .output || true

          echo "========== .NITRO =========="
          ls -la .nitro || true

          echo "========== BUILD =========="
          ls -la build || true
